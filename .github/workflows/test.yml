# Roda o teste de fumaça em todo Pull Request e em todo push na main.
name: Teste do jogo
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm i --no-save playwright@1 pngjs geojson-vt@3 vt-pbf
          npx playwright install --with-deps chromium
      - name: Servir o jogo
        run: python3 -m http.server 8080 &
      - name: Teste de fumaça
        run: node tests/smoke.mjs
      - name: Teste do multiplayer (2 abas, rede local)
        run: node tests/multiplayer.mjs
      - name: Teste do Mundo Real (dados sintéticos)
        run: node tests/world.mjs
      - name: Teste do joystick e do VR
        run: node tests/controls.mjs
